<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Lyric Vault</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.header h1{
    font-size:2rem;
    color:#38bdf8;
}

.stats{
    background:#1e293b;
    padding:15px;
    border-radius:12px;
    margin-bottom:20px;
    text-align:center;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
}

input,
textarea{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    margin-top:10px;
    background:#334155;
    color:white;
}

textarea{
    min-height:200px;
    resize:vertical;
}

button{
    border:none;
    border-radius:10px;
    padding:12px 18px;
    cursor:pointer;
    color:white;
    font-weight:bold;
}

.saveBtn{
    background:#2563eb;
    margin-top:12px;
}

.deleteBtn{
    background:#dc2626;
    margin-top:15px;
}

.song{
    background:#1e293b;
    border-radius:15px;
    padding:20px;
    margin-top:20px;
}

.song img{
    width:100%;
    max-height:250px;
    object-fit:cover;
    border-radius:10px;
    margin-bottom:15px;
}

.song h2{
    color:#38bdf8;
    margin-bottom:10px;
}

.song p{
    margin:6px 0;
}

.song pre{
    white-space:pre-wrap;
    line-height:1.6;
    background:#334155;
    padding:15px;
    border-radius:10px;
    margin-top:15px;
}

a{
    color:#60a5fa;
    text-decoration:none;
}

a:hover{
    text-decoration:underline;
}

hr{
    margin:15px 0;
    border-color:#334155;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🎵 AI Lyric Vault</h1>
<p>Simpan semua lirik lagu anda</p>
</div>

<div class="stats">
Jumlah Lagu:
<b id="totalSongs">0</b>
</div>

<div class="card">

<h2>➕ Tambah Lagu</h2>

<input id="title" placeholder="Tajuk Lagu">

<input id="artist" placeholder="Nama Penyanyi">

<input id="writer" placeholder="Penulis Lirik">

<input id="genre" placeholder="Genre">

<input id="date" type="date">

<input id="cover" placeholder="Link Cover Image">

<input id="youtube" placeholder="Link YouTube">

<input id="mp3" placeholder="Link MP3">

<textarea
id="lyrics"
placeholder="Tulis lirik lagu di sini">
</textarea>

<button class="saveBtn" onclick="saveSong()">
💾 Simpan Lagu
</button>

</div>

<div class="card">

<h2>🔍 Cari Lagu</h2>

<input
id="search"
placeholder="Cari tajuk, penyanyi atau lirik..."
onkeyup="displaySongs()">

</div>

<div id="songList"></div>

</div>

<script>

function getSongs(){
    return JSON.parse(
        localStorage.getItem("songs")
    ) || [];
}

function saveSong(){

    const title =
    document.getElementById("title").value.trim();

    const artist =
    document.getElementById("artist").value.trim();

    const writer =
    document.getElementById("writer").value.trim();

    const genre =
    document.getElementById("genre").value.trim();

    const date =
    document.getElementById("date").value;

    const cover =
    document.getElementById("cover").value.trim();

    const youtube =
    document.getElementById("youtube").value.trim();

    const mp3 =
    document.getElementById("mp3").value.trim();

    const lyrics =
    document.getElementById("lyrics").value.trim();

    if(!title || !lyrics){
        alert("Isi tajuk lagu dan lirik.");
        return;
    }

    const songs = getSongs();

    songs.unshift({
        id:Date.now(),
        title,
        artist,
        writer,
        genre,
        date,
        cover,
        youtube,
        mp3,
        lyrics
    });

    localStorage.setItem(
        "songs",
        JSON.stringify(songs)
    );

    document
    .querySelectorAll("input, textarea")
    .forEach(el => el.value = "");

    displaySongs();

    alert("Lagu berjaya disimpan.");
}

function deleteSong(id){

    if(!confirm("Padam lagu ini?")){
        return;
    }

    let songs = getSongs();

    songs = songs.filter(
        song => song.id !== id
    );

    localStorage.setItem(
        "songs",
        JSON.stringify(songs)
    );

    displaySongs();
}

function displaySongs(){

    const keyword =
    document.getElementById("search")
    .value.toLowerCase();

    const songs = getSongs();

    document.getElementById(
        "totalSongs"
    ).innerText = songs.length;

    let html = "";

    songs
    .filter(song =>

        song.title.toLowerCase().includes(keyword)
        ||
        song.artist.toLowerCase().includes(keyword)
        ||
        song.lyrics.toLowerCase().includes(keyword)

    )
    .forEach(song => {

        html += `

        <div class="song">

            ${
                song.cover
                ?
                `<img src="${song.cover}" alt="Cover">`
                :
                ""
            }

            <h2>🎵 ${song.title}</h2>

            <p><b>🎤 Penyanyi:</b> ${song.artist || "-"}</p>

            <p><b>✍️ Penulis:</b> ${song.writer || "-"}</p>

            <p><b>🎶 Genre:</b> ${song.genre || "-"}</p>

            <p><b>📅 Tarikh:</b> ${song.date || "-"}</p>

            ${
                song.youtube
                ?
                `<p>
                ▶ <a href="${song.youtube}"
                target="_blank">
                YouTube
                </a>
                </p>`
                :
                ""
            }

            ${
                song.mp3
                ?
                `<p>
                🎧 <a href="${song.mp3}"
                target="_blank">
                MP3
                </a>
                </p>`
                :
                ""
            }

            <hr>

            <pre>${song.lyrics}</pre>

            <button
            class="deleteBtn"
            onclick="deleteSong(${song.id})">
            🗑 Padam
            </button>

        </div>

        `;

    });

    document.getElementById(
        "songList"
    ).innerHTML = html;
}

displaySongs();

</script>

</body>
</html>
