
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Lyric Vault</title>

<style>
:root {
    --bg: #080d18;
    --panel: #111a2b;
    --panel2: #172238;
    --border: #263650;
    --text: #edf3ff;
    --muted: #91a0b8;
    --accent: #7c9cff;
    --danger: #ff647c;
    --success: #60d6a5;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
}

button, input, textarea, select {
    font: inherit;
}

button {
    cursor: pointer;
}

.container {
    width: min(1200px, 92%);
    margin: auto;
}

header {
    padding: 28px 0;
    border-bottom: 1px solid var(--border);
}

.header-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 1px;
}

.logo span {
    color: var(--accent);
}

.subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-top: 5px;
}

button {
    border: none;
    border-radius: 9px;
    padding: 11px 15px;
    color: white;
    background: var(--accent);
    font-weight: bold;
}

button:hover {
    opacity: .85;
}

button.secondary {
    background: var(--panel2);
    border: 1px solid var(--border);
}

button.danger {
    background: #512334;
    color: #ff9aab;
}

button.success {
    background: #174b3c;
    color: #83f0c2;
}

main {
    padding: 28px 0 60px;
}

.section-title {
    font-size: 19px;
    margin: 0 0 16px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 28px;
}

.stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 18px;
}

.stat-number {
    font-size: 27px;
    font-weight: bold;
}

.stat-label {
    color: var(--muted);
    font-size: 13px;
    margin-top: 5px;
}

.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 25px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 13px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.field.full {
    grid-column: 1 / -1;
}

label {
    color: var(--muted);
    font-size: 13px;
}

input, textarea, select {
    width: 100%;
    background: #0b1322;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    outline: none;
}

input:focus, textarea:focus, select:focus {
    border-color: var(--accent);
}

textarea {
    resize: vertical;
    min-height: 180px;
    line-height: 1.6;
}

.form-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 16px;
}

.toolbar {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 18px;
}

.library-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 16px;
}

.song-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
}

.song-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 13px;
    overflow: hidden;
    min-width: 0;
}

.cover {
    height: 155px;
    background: linear-gradient(135deg, #253c69, #111a2b);
    display: flex;
    justify-content: center;
    align-items: center;
    color: #a8bbff;
    font-size: 35px;
    font-weight: bold;
    overflow: hidden;
}

.cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.song-info {
    padding: 15px;
}

.song-title {
    font-size: 17px;
    font-weight: bold;
    overflow-wrap: anywhere;
    margin-bottom: 6px;
}

.song-artist {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 12px;
}

.tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
}

.tag {
    background: #202f4b;
    color: #b8caff;
    border-radius: 20px;
    padding: 5px 9px;
    font-size: 11px;
}

.song-date {
    color: var(--muted);
    font-size: 11px;
    margin-bottom: 13px;
}

.card-actions {
    display: flex;
    gap: 7px;
}

.card-actions button {
    flex: 1;
    padding: 9px 5px;
    font-size: 12px;
}

.empty-state {
    background: var(--panel);
    border: 1px dashed var(--border);
    padding: 45px 15px;
    text-align: center;
    border-radius: 13px;
    color: var(--muted);
    grid-column: 1 / -1;
}

.pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: 25px;
    flex-wrap: wrap;
}

.pagination button {
    min-width: 40px;
    padding: 9px 12px;
}

.pagination button.active {
    background: white;
    color: #172238;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    background: rgba(0, 0, 0, .78);
    padding: 20px;
    overflow-y: auto;
}

.modal.show {
    display: flex;
    align-items: flex-start;
    justify-content: center;
}

.modal-content {
    width: min(750px, 100%);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 23px;
    margin: auto;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 15px;
    margin-bottom: 15px;
}

.modal-header h2 {
    margin: 0;
    overflow-wrap: anywhere;
}

.close-btn {
    background: var(--panel2);
    padding: 8px 12px;
}

.lyrics-content {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.8;
    background: #0b1322;
    border-radius: 10px;
    padding: 18px;
    max-height: 60vh;
    overflow-y: auto;
    font-size: 14px;
}

.modal-links {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 15px;
}

.modal-links a {
    color: #a8bbff;
    text-decoration: none;
    font-size: 13px;
}

footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 25px 0;
    border-top: 1px solid var(--border);
}

@media (max-width: 850px) {
    .song-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .toolbar {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 520px) {
    .stats {
        grid-template-columns: repeat(3, 1fr);
        gap: 7px;
    }

    .stat-card {
        padding: 12px 8px;
    }

    .stat-number {
        font-size: 21px;
    }

    .stat-label {
        font-size: 10px;
    }

    .song-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
    }

    .cover {
        height: 110px;
    }

    .song-info {
        padding: 10px;
    }

    .song-title {
        font-size: 14px;
    }

    .card-actions {
        flex-direction: column;
    }

    .toolbar {
        grid-template-columns: 1fr 1fr;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .field.full {
        grid-column: auto;
    }
}
</style>
</head>

<body>

<header>
    <div class="container header-content">
        <div>
            <div class="logo">AI LYRIC <span>VAULT</span></div>
            <div class="subtitle">Your personal songwriting archive.</div>
        </div>

        <div>
            <button id="exportBtn" class="secondary">Export Backup</button>
            <button id="importBtn" class="secondary">Import Backup</button>
            <input type="file" id="importFile" accept=".json,application/json" hidden>
        </div>
    </div>
</header>

<main class="container">

    <section class="stats">
        <div class="stat-card">
            <div class="stat-number" id="totalSongs">0</div>
            <div class="stat-label">Total Songs</div>
        </div>

        <div class="stat-card">
            <div class="stat-number" id="totalArtists">0</div>
            <div class="stat-label">Artists</div>
        </div>

        <div class="stat-card">
            <div class="stat-number" id="totalGenres">0</div>
            <div class="stat-label">Genres</div>
        </div>
    </section>

    <section class="panel" id="formPanel">
        <h2 class="section-title" id="formTitle">＋ Add New Song</h2>

        <form id="songForm">
            <div class="form-grid">

                <div class="field">
                    <label for="title">Song Title *</label>
                    <input id="title" required placeholder="Enter song title">
                </div>

                <div class="field">
                    <label for="artist">Artist *</label>
                    <input id="artist" required placeholder="Enter artist name">
                </div>

                <div class="field">
                    <label for="writer">Songwriter</label>
                    <input id="writer" placeholder="Enter songwriter">
                </div>

                <div class="field">
                    <label for="genre">Genre</label>
                    <input id="genre" placeholder="e.g. KR&B, Hip-Hop">
                </div>

                <div class="field">
                    <label for="date">Release / Creation Date</label>
                    <input id="date" type="date">
                </div>

                <div class="field">
                    <label for="cover">Cover Image URL</label>
                    <input id="cover" type="url" placeholder="https://example.com/cover.jpg">
                </div>

                <div class="field">
                    <label for="youtube">YouTube Link</label>
                    <input id="youtube" type="url" placeholder="https://youtube.com/...">
                </div>

                <div class="field">
                    <label for="mp3">Audio Link</label>
                    <input id="mp3" type="url" placeholder="https://example.com/audio.mp3">
                </div>

                <div class="field full">
                    <label for="lyrics">Lyrics *</label>
                    <textarea id="lyrics" required placeholder="Write your lyrics here..."></textarea>
                </div>

            </div>

            <div class="form-actions">
                <button type="submit" id="saveBtn">Save Song</button>
                <button type="button" class="secondary" id="cancelEditBtn" hidden>Cancel Edit</button>
                <button type="reset" class="secondary">Clear Form</button>
            </div>
        </form>
    </section>

    <section>
        <div class="library-info">
            <h2 class="section-title">Your Library</h2>
            <span class="subtitle" id="resultCount">0 songs</span>
        </div>

        <div class="toolbar">
            <input id="search" placeholder="Search songs, artists, lyrics...">

            <select id="artistFilter">
                <option value="">All Artists</option>
            </select>

            <select id="genreFilter">
                <option value="">All Genres</option>
            </select>

            <select id="sortBy">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="az">Title A–Z</option>
                <option value="za">Title Z–A</option>
            </select>
        </div>

        <div class="song-grid" id="songGrid"></div>

        <div class="pagination" id="pagination"></div>
    </section>

</main>

<div class="modal" id="songModal">
    <div class="modal-content">
        <div class="modal-header">
            <div>
                <h2 id="modalTitle">Song Title</h2>
                <div class="subtitle" id="modalArtist"></div>
            </div>
            <button class="close-btn" id="closeModal">✕</button>
        </div>

        <div class="tags" id="modalTags"></div>

        <div class="lyrics-content" id="modalLyrics"></div>

        <div class="modal-links" id="modalLinks"></div>
    </div>
</div>

<footer>
    AI Lyric Vault · Personal Edition · Data stored locally in your browser
</footer>

<script>
const STORAGE_KEY = "songs";
const SONGS_PER_PAGE = 12;

let songs = loadSongs();
let currentPage = 1;
let editingId = null;

const $ = id => document.getElementById(id);

function loadSongs() {
    try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(saved) ? saved.map(normalizeSong) : [];
    } catch {
        return [];
    }
}

function normalizeSong(song) {
    return {
        id: String(song.id || makeId()),
        title: String(song.title || ""),
        artist: String(song.artist || ""),
        writer: String(song.writer || ""),
        genre: String(song.genre || ""),
        date: String(song.date || ""),
        cover: String(song.cover || ""),
        youtube: String(song.youtube || ""),
        mp3: String(song.mp3 || ""),
        lyrics: String(song.lyrics || "")
    };
}

function makeId() {
    if (window.crypto && crypto.randomUUID) {
        return crypto.randomUUID();
    }

    return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function saveStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(songs));
}

function safeUrl(value) {
    try {
        const url = new URL(value);

        if (url.protocol === "https:" || url.protocol === "http:") {
            return url.href;
        }
    } catch {}

    return "";
}

function createElement(tag, className, text) {
    const element = document.createElement(tag);

    if (className) {
        element.className = className;
    }

    if (text !== undefined) {
        element.textContent = text;
    }

    return element;
}

function updateStats() {
    $("totalSongs").textContent = songs.length;

    $("totalArtists").textContent =
        new Set(songs.map(s => s.artist.trim().toLowerCase()).filter(Boolean)).size;

    $("totalGenres").textContent =
        new Set(songs.map(s => s.genre.trim().toLowerCase()).filter(Boolean)).size;
}

function updateFilters() {
    const artistValue = $("artistFilter").value;
    const genreValue = $("genreFilter").value;

    const artists = [...new Set(
        songs.map(s => s.artist.trim()).filter(Boolean)
    )].sort((a, b) => a.localeCompare(b));

    const genres = [...new Set(
        songs.map(s => s.genre.trim()).filter(Boolean)
    )].sort((a, b) => a.localeCompare(b));

    $("artistFilter").replaceChildren(
        new Option("All Artists", ""),
        ...artists.map(name => new Option(name, name))
    );

    $("genreFilter").replaceChildren(
        new Option("All Genres", ""),
        ...genres.map(name => new Option(name, name))
    );

    $("artistFilter").value = artists.includes(artistValue) ? artistValue : "";
    $("genreFilter").value = genres.includes(genreValue) ? genreValue : "";
}

function getFilteredSongs() {
    const keyword = $("search").value.trim().toLowerCase();
    const artist = $("artistFilter").value;
    const genre = $("genreFilter").value;
    const sort = $("sortBy").value;

    let result = songs.filter(song => {
        const searchable = [
            song.title,
            song.artist,
            song.writer,
            song.genre,
            song.lyrics
        ].join(" ").toLowerCase();

        return searchable.includes(keyword)
            && (!artist || song.artist === artist)
            && (!genre || song.genre === genre);
    });

    result.sort((a, b) => {
        if (sort === "az") {
            return a.title.localeCompare(b.title);
        }

        if (sort === "za") {
            return b.title.localeCompare(a.title);
        }

        if (sort === "oldest") {
            return (a.date || "").localeCompare(b.date || "");
        }

        return (b.date || "").localeCompare(a.date || "");
    });

    return result;
}

function renderLibrary() {
    updateStats();
    updateFilters();

    const filtered = getFilteredSongs();
    const totalPages = Math.max(1, Math.ceil(filtered.length / SONGS_PER_PAGE));

    currentPage = Math.min(currentPage, totalPages);

    const start = (currentPage - 1) * SONGS_PER_PAGE;
    const pageSongs = filtered.slice(start, start + SONGS_PER_PAGE);

    $("resultCount").textContent =
        `${filtered.length} song${filtered.length === 1 ? "" : "s"}`;

    const grid = $("songGrid");
    grid.replaceChildren();

    if (pageSongs.length === 0) {
        const empty = createElement(
            "div",
            "empty-state",
            songs.length === 0
                ? "Your vault is empty. Add your first song above!"
                : "No songs found. Try another search or filter."
        );

        grid.appendChild(empty);
    } else {
        pageSongs.forEach(song => {
            grid.appendChild(createSongCard(song));
        });
    }

    renderPagination(totalPages);
}

function createSongCard(song) {
    const card = createElement("article", "song-card");

    const cover = createElement("div", "cover");

    const coverUrl = safeUrl(song.cover);

    if (coverUrl) {
        const image = document.createElement("img");
        image.src = coverUrl;
        image.alt = song.title + " cover";
        image.loading = "lazy";

        image.onerror = () => {
            cover.replaceChildren();
            cover.textContent = "♫";
        };

        cover.appendChild(image);
    } else {
        cover.textContent = "♫";
    }

    const info = createElement("div", "song-info");
    const title = createElement("div", "song-title", song.title);
    const artist = createElement("div", "song-artist", song.artist);

    const tags = createElement("div", "tags");

    if (song.genre) {
        tags.appendChild(createElement("span", "tag", song.genre));
    }

    if (song.writer) {
        tags.appendChild(createElement("span", "tag", "Written by " + song.writer));
    }

    const date = createElement(
        "div",
        "song-date",
        song.date ? "Date: " + song.date : "No date added"
    );

    const actions = createElement("div", "card-actions");

    const viewBtn = createElement("button", "", "Quick View");
    viewBtn.addEventListener("click", () => openSong(song.id));

    const editBtn = createElement("button", "secondary", "Edit");
    editBtn.addEventListener("click", () => editSong(song.id));

    const deleteBtn = createElement("button", "danger", "Delete");
    deleteBtn.addEventListener("click", () => deleteSong(song.id));

    actions.append(viewBtn, editBtn, deleteBtn);
    info.append(title, artist, tags, date, actions);
    card.append(cover, info);

    return card;
}

function renderPagination(totalPages) {
    const container = $("pagination");
    container.replaceChildren();

    if (totalPages <= 1) return;

    const previous = createElement("button", "secondary", "‹");
    previous.disabled = currentPage === 1;
    previous.addEventListener("click", () => {
        currentPage--;
        renderLibrary();
    });

    container.appendChild(previous);

    for (let page = 1; page <= totalPages; page++) {
        const button = createElement(
            "button",
            page === currentPage ? "active" : "secondary",
            String(page)
        );

        button.addEventListener("click", () => {
            currentPage = page;
            renderLibrary();
        });

        container.appendChild(button);
    }

    const next = createElement("button", "secondary", "›");
    next.disabled = currentPage === totalPages;
    next.addEventListener("click", () => {
        currentPage++;
        renderLibrary();
    });

    container.appendChild(next);
}

function openSong(id) {
    const song = songs.find(s => s.id === id);
    if (!song) return;

    $("modalTitle").textContent = song.title;
    $("modalArtist").textContent = song.artist;

    $("modalLyrics").textContent = song.lyrics;

    const tags = $("modalTags");
    tags.replaceChildren();

    [song.genre, song.writer ? "Writer: " + song.writer : "", song.date]
        .filter(Boolean)
        .forEach(value => {
            tags.appendChild(createElement("span", "tag", value));
        });

    const links = $("modalLinks");
    links.replaceChildren();

    [
        ["YouTube", song.youtube],
        ["Audio", song.mp3]
    ].forEach(([label, value]) => {
        const url = safeUrl(value);

        if (!url) return;

        const link = document.createElement("a");
        link.href = url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Open " + label;

        links.appendChild(link);
    });

    $("songModal").classList.add("show");
}

function closeModal() {
    $("songModal").classList.remove("show");
}

function editSong(id) {
    const song = songs.find(s => s.id === id);
    if (!song) return;

    editingId = id;

    $("title").value = song.title;
    $("artist").value = song.artist;
    $("writer").value = song.writer;
    $("genre").value = song.genre;
    $("date").value = song.date;
    $("cover").value = song.cover;
    $("youtube").value = song.youtube;
    $("mp3").value = song.mp3;
    $("lyrics").value = song.lyrics;

    $("formTitle").textContent = "✎ Edit Song";
    $("saveBtn").textContent = "Update Song";
    $("cancelEditBtn").hidden = false;

    $("formPanel").scrollIntoView({ behavior: "smooth" });
}

function cancelEdit() {
    editingId = null;
    $("songForm").reset();

    $("formTitle").textContent = "＋ Add New Song";
    $("saveBtn").textContent = "Save Song";
    $("cancelEditBtn").hidden = true;
}

function deleteSong(id) {
    const song = songs.find(s => s.id === id);
    if (!song) return;

    if (!confirm(`Delete "${song.title}"? This action cannot be undone.`)) {
        return;
    }

    songs = songs.filter(s => s.id !== id);
    saveStorage();

    if (editingId === id) {
        cancelEdit();
    }

    renderLibrary();
}

$("songForm").addEventListener("submit", event => {
    event.preventDefault();

    const songData = {
        title: $("title").value.trim(),
        artist: $("artist").value.trim(),
        writer: $("writer").value.trim(),
        genre: $("genre").value.trim(),
        date: $("date").value,
        cover: $("cover").value.trim(),
        youtube: $("youtube").value.trim(),
        mp3: $("mp3").value.trim(),
        lyrics: $("lyrics").value.trim()
    };

    if (!songData.title || !songData.artist || !songData.lyrics) {
        alert("Please complete the required fields.");
        return;
    }

    if (editingId) {
        songs = songs.map(song =>
            song.id === editingId
                ? { ...song, ...songData }
                : song
        );
    } else {
        songs.push({
            id: makeId(),
            ...songData
        });
    }

    saveStorage();
    cancelEdit();

    currentPage = 1;
    renderLibrary();

    alert(editingId ? "Song updated!" : "Song saved!");
});

$("cancelEditBtn").addEventListener("click", cancelEdit);

$("closeModal").addEventListener("click", closeModal);

$("songModal").addEventListener("click", event => {
    if (event.target === $("songModal")) {
        closeModal();
    }
});

$("search").addEventListener("input", () => {
    currentPage = 1;
    renderLibrary();
});

$("artistFilter").addEventListener("change", () => {
    currentPage = 1;
    renderLibrary();
});

$("genreFilter").addEventListener("change", () => {
    currentPage = 1;
    renderLibrary();
});

$("sortBy").addEventListener("change", () => {
    currentPage = 1;
    renderLibrary();
});

// EXPORT BACKUP
$("exportBtn").addEventListener("click", () => {
    const file = new Blob(
        [JSON.stringify(songs, null, 2)],
        { type: "application/json" }
    );

    const url = URL.createObjectURL(file);
    const link = document.createElement("a");

    link.href = url;
    link.download = "AI-Lyric-Vault-Backup.json";
    link.click();

    URL.revokeObjectURL(url);
});

// IMPORT BACKUP
$("importBtn").addEventListener("click", () => {
    $("importFile").click();
});

$("importFile").addEventListener("change", async event => {
    const file = event.target.files[0];
    if (!file) return;

    try {
        const content = await file.text();
        const imported = JSON.parse(content);

        if (!Array.isArray(imported)) {
            throw new Error("Invalid backup format.");
        }

        const normalized = imported.map(normalizeSong);

        if (!confirm(
            `Import ${normalized.length} songs? Existing songs will be replaced.`
        )) {
            event.target.value = "";
            return;
        }

        songs = normalized;
        saveStorage();

        currentPage = 1;
        cancelEdit();
        renderLibrary();

        alert("Backup imported successfully!");
    } catch (error) {
        alert("Unable to import this file. Please check your backup.");
    }

    event.target.value = "";
});

// INITIALIZE
renderLibrary();
</script>

</body>
</html>
